name: scimscore

# Local development stack. All ports are bound to 127.0.0.1 only.
services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: scimscore-php:dev
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on: [app]
    networks: [backend]
    restart: unless-stopped

  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=0
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-scimscore}
      MYSQL_USER: ${DB_USERNAME:-scimscore}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_UI_PORT:-8025}:8025"
    networks: [backend]
    restart: unless-stopped

  # One-off tool for frontend assets: docker compose run --rm node npm run build
  node:
    image: node:22-alpine
    profiles: [tools]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    environment:
      HOME: /tmp
    volumes:
      - ./:/var/www/html

volumes:
  dbdata:

networks:
  backend:
