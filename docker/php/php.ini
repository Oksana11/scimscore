; Local development settings
expose_php = Off
memory_limit = 512M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
date.timezone = UTC

display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

session.use_strict_mode = 1
session.cookie_httponly = 1

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
