# SCIMSCORE — nginx site. Installed by deploy/aws/setup.sh (__DOMAIN__ is replaced).
# HTTPS is terminated in front of this server (load balancer / Cloudflare); set
# TRUSTED_PROXIES in .env to its address range so client IPs and https are detected.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # default_server: CloudFront may send the origin host name, not the public domain.
    server_name __DOMAIN__;

    root /var/www/scimscore/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 8m;

    access_log /var/log/nginx/scimscore.access.log;
    error_log  /var/log/nginx/scimscore.error.log;

    # Never serve dotfiles (.env, .git …) or anything outside public/.
    location ~ /\.(?!well-known) { deny all; return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # Only the front controller is executed.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }
}
