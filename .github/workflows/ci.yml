name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — style, tests, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, gd, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Known vulnerabilities in PHP packages
        run: composer audit

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  frontend:
    name: Frontend — audit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      # Code shipped to browsers ("dependencies") must be clean. Build tools ("devDependencies":
      # Vite, Tailwind…) never reach users or the server: their advisories are shown as warnings
      # to review (e.g. upstream ReDoS fixes not released yet), without blocking a release.
      - name: Known vulnerabilities in shipped npm packages
        run: npm audit --omit=dev --audit-level=high
      - name: Known vulnerabilities in build tools (report)
        run: npm audit --audit-level=high || echo "::warning::npm audit reports build-tool advisories — review and update when fixes are released."
      - run: npm run build

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Semgrep and pinned community rules
        run: |
          pip install --quiet semgrep==1.180.0
          git clone --quiet https://github.com/semgrep/semgrep-rules.git /tmp/semgrep-rules
          git -C /tmp/semgrep-rules checkout --quiet a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          find /tmp/semgrep-rules -name '*.test.*' -delete
      # PHP/Laravel + browser JavaScript security rules. Any finding fails the build;
      # a false positive is fixed in code or excluded with a justified `nosemgrep` comment.
      - name: Static security analysis
        run: |
          semgrep scan --metrics=off --error \
            --config /tmp/semgrep-rules/php \
            --config /tmp/semgrep-rules/javascript/lang \
            --config /tmp/semgrep-rules/javascript/browser \
            app bootstrap config database routes resources/js public/index.php
