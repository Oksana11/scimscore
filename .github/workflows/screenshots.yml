name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: ['stage-10-redesign']

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'intl, pdo_sqlite, gd, zip, bcmath', coverage: none }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci && npm run build && npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: App with SQLite and log mailer
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/; s/^DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/; s/^MAIL_MAILER=.*/MAIL_MAILER=log/; s/^APP_URL=.*/APP_URL=http:\/\/127.0.0.1:8000/' .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan security:generate-keys
          php artisan migrate --seed --force
          php artisan tinker --execute="App\Models\Institution::create(['name'=>'Loewenstein Rehabilitation Medical Center','ror_id'=>'0demo0001','country_code'=>'IL']); App\Models\Institution::create(['name'=>'Sheba Medical Center','ror_id'=>'0demo0002','country_code'=>'IL']);"
          (php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &)
          sleep 3
      - run: mkdir -p screenshots && node tests/Browser/screenshots.mjs
      - if: always()
        run: tail -n 60 storage/logs/laravel.log | grep -v "letter-spacing" || true
      - name: Publish screenshots to the 'screenshots' branch
        if: always()
        run: |
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Screenshots of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
