name: Update composer.lock (one-off for PHP 8.3)

on:
  push:
    branches: [php83]
    paths: [composer.json]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'intl, gd, zip, bcmath', coverage: none, tools: 'composer:v2' }
      - run: composer update --no-interaction --no-progress --no-scripts
      - name: Commit lock file
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add composer.lock
          git commit -m "composer.lock for PHP 8.3 (Symfony 7.4, openspout 4)" || exit 0
          git push
